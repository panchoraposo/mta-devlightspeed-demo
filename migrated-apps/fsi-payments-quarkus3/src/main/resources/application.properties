#
# Dev Services (PostgreSQL)
#
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.devservices.db-name=fsi_payments
%dev.quarkus.datasource.devservices.username=payments
%dev.quarkus.datasource.devservices.password=payments
%dev.quarkus.datasource.devservices.reuse=true

# Dev UI (solo en dev mode)
%dev.quarkus.http.host=0.0.0.0
%dev.quarkus.http.port=8087
%dev.quarkus.dev-ui.enabled=true

# Para que el schema no se borre en cada restart (y los datos seed queden estables)
%dev.quarkus.hibernate-orm.schema-management.strategy=update
%dev.quarkus.hibernate-orm.log.sql=true

# Runtime (OpenShift). En dev mode siguen activos los Dev Services de arriba.
# El Deployment de RHADS sobreescribe la URL JDBC con el PostgreSQL del namespace.
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.username=payments
%prod.quarkus.datasource.password=payments
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/fsi_payments
%prod.quarkus.hibernate-orm.schema-management.strategy=update
# Default values for quarkus-template.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
runtime: quarkus

image:
  pullPolicy: Always
  registry: 
  host: 
  organization: 
  name: 
  tag: 
  password: 

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true

  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: 
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 8080

route:
  host: ""
  path: /

livenessProbe:
  httpGet:
    path: ${{ values.probe_path }}
    port: http
  initialDelaySeconds: 50
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 12

readinessProbe:
  httpGet:
    path: ${{ values.probe_path }}
    port: http
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 18

resources: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

user:

targetNamespace: ${{ values.targetNamespace }}
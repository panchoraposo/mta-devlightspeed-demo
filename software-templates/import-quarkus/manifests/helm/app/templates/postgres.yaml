{%- if values.database == "postgresql" %}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "quarkus-template.name" . }}-db
  labels:
    app.kubernetes.io/name: {{ include "quarkus-template.name" . }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "quarkus-template.name" . }}-db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "quarkus-template.name" . }}-db
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: postgresql
          image: quay.io/sclorg/postgresql-16-c9s:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRESQL_USER
              value: ${{ values.db_user }}
            - name: POSTGRESQL_PASSWORD
              value: ${{ values.db_password }}
            - name: POSTGRESQL_DATABASE
              value: ${{ values.db_name }}
            - name: POSTGRESQL_ADMIN_PASSWORD
              value: ${{ values.db_password }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "${{ values.db_user }}", "-d", "${{ values.db_name }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "quarkus-template.name" . }}-db
  labels:
    app.kubernetes.io/name: {{ include "quarkus-template.name" . }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
  selector:
    app.kubernetes.io/name: {{ include "quarkus-template.name" . }}-db
    app.kubernetes.io/instance: {{ .Release.Name }}
{%- endif %}

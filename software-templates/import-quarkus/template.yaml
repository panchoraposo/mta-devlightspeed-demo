apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: import-quarkus
  title: Import existing Quarkus app
  description: "Importa un repositorio Quarkus que ya existe y crea el mismo flujo RHADS que los templates Quarkus: GitLab, Dev Spaces (RHDA + gitsign), Nexus, OpenShift Builds, SBOM en TPA, cosign, ACS, Conforma y GitOps dev/staging/prod."
  tags:
    - recommended
    - quarkus
    - java
    - rhads
    - import
spec:
  owner: group:default/developers
  type: service
  parameters:
    - title: Application
      required: [component_id, source_url, owner]
      properties:
        component_id:
          title: Name
          type: string
          default: fsi-payments
          description: Nombre del componente. Máximo 18 caracteres. Para esta demo, fsi-payments.
          ui:field: EntityNamePicker
          maxLength: 18
        source_url:
          title: Existing Quarkus source
          type: string
          default: https://github.com/panchoraposo/mta-devlightspeed-demo/tree/main/migrated-apps/fsi-payments-quarkus3
          description: URL del código ya migrado. Puede ser la raíz del repo o un subdirectorio (/tree/<branch>/<path>).
        description:
          title: Description
          type: string
          default: Existing Quarkus application onboarded to RHADS
        owner:
          title: Owner
          type: string
          default: developers
        database:
          title: Database
          type: string
          enum: [postgresql, none]
          default: postgresql
          description: fsi-payments usa PostgreSQL. Elegí none si la app no necesita base de datos.
        db_name:
          title: Database name
          type: string
          default: fsi_payments
        db_user:
          title: Database user
          type: string
          default: payments
        db_password:
          title: Database password
          type: string
          default: payments
          ui:field: Secret
        probe_path:
          title: Health probe path
          type: string
          default: /
          description: Ruta HTTP que responde 200. fsi-payments sirve / . Si la app tiene SmallRye Health, usá /q/health/live.
        dockerfile:
          title: Dockerfile
          type: string
          default: ./src/main/docker/Dockerfile.jvm
        port:
          title: Container port
          type: number
          default: 8080
    - title: Image registry
      required: [image_registry, image_host]
      properties:
        image_registry:
          title: Image Registry
          type: string
          enum: [Quay]
          default: Quay
        image_host:
          title: Quay host
          type: string
          default: quay-quay-quay.apps.ocp.4frcl.sandbox3499.opentlc.com
          description: Host del registry, sin https.
        image_tag:
          title: Image tag
          type: string
          default: latest
    - title: GitLab and cluster
      required: [repo, gitlab_group, cluster_subdomain]
      properties:
        repo:
          title: Repository Location
          type: object
          properties:
            host:
              title: GitLab host
              type: string
              default: gitlab-gitlab.apps.ocp.4frcl.sandbox3499.opentlc.com
              description: Host de GitLab, sin https.
        gitlab_group:
          title: GitLab group
          type: string
          default: developers
        cluster_subdomain:
          title: Cluster apps domain
          type: string
          default: apps.ocp.4frcl.sandbox3499.opentlc.com
          description: Dominio de las rutas, sin https.
  steps:
    - id: fetch-app
      name: Fetch existing Quarkus source
      action: fetch:plain
      input:
        url: ${{ parameters.source_url }}
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}

    - id: fetch-static
      name: Add Nexus settings, TechDocs CI, and gitsign
      action: fetch:plain
      input:
        url: ./static
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}

    - id: fetch-rhads
      name: Add Developer Hub, Dev Spaces, and TechDocs
      action: fetch:template
      input:
        url: ./overlay
        values:
          component_id: ${{ parameters.component_id }}
          description: ${{ parameters.description }}
          namespace: ${{ parameters.component_id }}-dev
          owner: ${{ parameters.owner }}
          gitlab_group: ${{ parameters.gitlab_group }}
          host: ${{ parameters.repo.host }}
          destination: ${{ parameters.gitlab_group }}/${{ parameters.component_id }}
          gitops_namespace: openshift-gitops
          cluster_subdomain: ${{ parameters.cluster_subdomain }}
          image_organization: rhads
          image_host: ${{ parameters.image_host }}
        targetPath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}

    - id: publish
      name: Publish source to GitLab
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.gitlab_group }}&repo=${{ parameters.component_id }}"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.gitlab_group }}-${{ parameters.component_id }}
        settings:
          auto_devops_enabled: false

    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml

    - id: template-gitops
      name: Generate GitOps (app of apps)
      action: fetch:template
      input:
        url: ./manifests
        values:
          component_id: ${{ parameters.component_id }}
          source_repository_gitops: https://${{ parameters.repo.host }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
          source_repository: https://${{ parameters.repo.host }}/${{ parameters.gitlab_group }}/${{ parameters.component_id }}.git
          owner: ${{ parameters.owner }}
          namespace: ${{ parameters.component_id }}-dev
          targetNamespace: ${{ parameters.component_id }}-dev
          image_registry: ${{ parameters.image_registry }}
          image_host: ${{ parameters.image_host }}
          image_organization: rhads
          image_password: backstage
          image_name: ${{ parameters.component_id }}
          image_tag: ${{ parameters.image_tag }}
          gitops_namespace: openshift-gitops
          gitops_project: default
          port: ${{ parameters.port }}
          cluster_subdomain: ${{ parameters.cluster_subdomain }}
          repository_host: ${{ parameters.repo.host }}
          dockerfile: ${{ parameters.dockerfile }}
          build_language: maven
          database: ${{ parameters.database }}
          db_name: ${{ parameters.db_name }}
          db_user: ${{ parameters.db_user }}
          db_password: ${{ secrets.db_password }}
          probe_path: ${{ parameters.probe_path }}
        targetPath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops

    - id: publish-gitops
      name: Publish GitOps repository
      action: publish:gitlab
      input:
        repoUrl: "${{ parameters.repo.host }}?owner=${{ parameters.owner }}&repo=${{ parameters.component_id }}-gitops"
        repoVisibility: public
        defaultBranch: main
        sourcePath: ./${{ parameters.owner }}-${{ parameters.component_id }}-gitops
        settings:
          auto_devops_enabled: false

    - id: create-argocd
      name: Create Argo CD app-of-apps
      action: argocd:create-resources
      input:
        appName: ${{ parameters.component_id }}-bootstrap
        argoInstance: main
        namespace: openshift-gitops
        repoUrl: https://${{ parameters.repo.host }}/${{ parameters.owner }}/${{ parameters.component_id }}-gitops.git
        path: argocd/

  output:
    links:
      - title: Source repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}
